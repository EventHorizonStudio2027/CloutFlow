name: Deploy CloutFlow preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cloutflow-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify financial logic
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Assemble static site without repository internals
        run: |
          mkdir -p _site
          cp index.html apple-touch-icon.png manifest.webmanifest _site/
          cp -R assets _site/assets
          touch _site/.nojekyll
          test -s _site/index.html
          test -f _site/assets/js/app.js
          test -f _site/assets/css/app.css
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
