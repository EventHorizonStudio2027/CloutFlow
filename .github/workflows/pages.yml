name: Deploy CloutFlow preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: cloutflow-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify financial logic
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Assemble static site without repository internals
        run: |
          mkdir -p _site
          cp index.html apple-touch-icon.png manifest.webmanifest _site/
          cp -R assets _site/assets
          # Keep installed web apps from reusing the previous header assets.
          for asset in assets/css/app.css assets/js/universal-search.js assets/js/mobile-navigation.js assets/js/accessibility.js; do
            revision=$(git hash-object "$asset")
            sed -i "s|${asset}\"|${asset}?v=${revision}\"|g" _site/index.html
          done
          touch _site/.nojekyll
          test -s _site/index.html
          test -f _site/assets/js/app.js
          test -f _site/assets/css/app.css
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" \
                --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -q '[0-9]'; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "::error::The uploaded github-pages artifact did not appear in the Actions API."
          exit 1
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
