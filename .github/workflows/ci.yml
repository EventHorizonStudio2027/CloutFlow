name: CloutFlow quality checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloutflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-regression:
    name: Financial logic and unit regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression suite
        run: npm test

  browser-regression:
    name: Chromium browser regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Playwright
        run: python -m pip install 'playwright==1.58.0'
      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.58.0-linux
      - name: Install Chromium system dependencies
        run: python -m playwright install-deps chromium
      - name: Install Chromium browser if not cached
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium
      - name: Expose Chromium at the test harness path
        run: |
          CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          test -x "$CHROMIUM_PATH"
          sudo ln -sf "$CHROMIUM_PATH" /usr/bin/chromium
      - name: Run Chromium regression shard ${{ matrix.shard }} of 4
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, sys, time
          tests=sorted(pathlib.Path('tests').glob('browser*.test.py'))
          shard=int(os.environ['SHARD'])
          chosen=tests[shard::4]
          print(f'Chromium shard {shard}: {len(chosen)} of {len(tests)} test files',flush=True)
          durations=[]
          for test in chosen:
              print(f'::group::Chromium {test}',flush=True)
              start=time.monotonic()
              try:
                  result=subprocess.run([sys.executable,str(test)],timeout=240)
              except subprocess.TimeoutExpired:
                  print(f'::error file={test}::Browser test timed out after 240 seconds',flush=True)
                  sys.exit(124)
              finally:
                  print('::endgroup::',flush=True)
              elapsed=time.monotonic()-start
              durations.append((str(test),elapsed))
              print(f'{test}: {elapsed:.1f}s',flush=True)
              if result.returncode:
                  print(f'::error file={test}::Browser regression failed (exit {result.returncode})',flush=True)
                  sys.exit(result.returncode)
          print('Shard timings:',flush=True)
          for name,elapsed in durations: print(f'  {elapsed:6.1f}s  {name}',flush=True)
          PY
